sonar.projectKey=vallejo-sanjuan_PortalDash
sonar.organization=vallejo-sanjuan

# Un solo análisis unificado: dotnet-sonarscanner begin/end (ver .github/workflows/sonarcloud.yml)
# envuelve TODO el escaneo -- el build real de portal-src y APCWeb le da a Sonar la información de
# compilación que necesita para analizar C#, y estas mismas fuentes (sonar.sources) cubren también
# el JS/TS de los dashboards Node, que Sonar analiza directo desde el código fuente (no hace falta
# build para JS/TS). No correr una action de sonar-scanner separada: generaría un segundo análisis
# que pisaría a este en SonarCloud.
sonar.sources=portal-src,dashboards
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/dist-server/**,\
  **/bin/**,\
  **/obj/**,\
  **/App_Data/**,\
  **/daemon/**,\
  **/*.min.js,\
  dashboards/EstadoResultado/sap-inbox/**,\
  dashboards/EstadoResultado/data-store/**,\
  dashboards/EstadoResultado/SAPResultProcesado/**,\
  dashboards/EstadoResultado/data-cache/**,\
  dashboards/ConciliacionPunitorios/archivos/**,\
  dashboards/ConciliacionPunitorios/public/data*.js,\
  dashboards/ValidacionCobranzas/archivos/**,\
  dashboards/sucursal-user-visualizer/layout-state.json,\
  dashboards/MotorReposicion/public/~$*

sonar.sourceEncoding=UTF-8
